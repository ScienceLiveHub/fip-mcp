[project]
name = "fip-mcp"
version = "0.0.1"
description = "MCP server that turns FAIR Implementation Profiles into guidance and deterministic compliance checks for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anne Fouilloux" }]
dependencies = [
    "mcp>=1.2.0,<2",
    "rdflib>=7",
]

[project.scripts]
fip-mcp = "fip_mcp.server:main"
fip-check = "fip_mcp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fip_mcp"]
